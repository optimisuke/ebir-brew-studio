<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QR｜マイエビール記録｜ÉBIR BREW STUDIO</title>
<meta name="description" content="マイエビール記録アプリへの QR。スマホで読み取ってご利用ください。" />
<meta name="robots" content="noindex, follow" />
<meta name="theme-color" content="#141414" />
<link rel="canonical" href="https://optimisuke.github.io/ebir-brew-studio/app/qr.html" />
<link rel="icon" href="../assets/logo.jpeg" />
<link rel="apple-touch-icon" href="../assets/logo.jpeg" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', '"Hiragino Kaku Gothic ProN"', '"Noto Sans JP"', 'sans-serif'] },
      colors: { ink: '#141414', paper: '#ffffff', cream: '#FBF7EF', gold: '#E2A52A', goldDark: '#C0871C' },
    } },
  };
</script>
<!-- オフライン QR 生成（assets/vendor/qrcode.min.js にベンダリング） -->
<script src="../assets/vendor/qrcode.min.js"></script>
<style>
  body { -webkit-font-smoothing: antialiased; }
  /* QR はスマホ幅に収める */
  #qr canvas, #qr img { display: block; width: 100%; height: auto; max-width: 190px; }
</style>
</head>

<body class="bg-cream text-ink font-sans antialiased">

<!-- Header（アプリと共通）-->
<header class="sticky top-0 z-40 bg-paper/90 backdrop-blur border-b border-ink/10">
  <div class="mx-auto max-w-2xl px-5 h-16 flex items-center justify-between">
    <a href="../" class="flex items-center gap-2.5">
      <img src="../assets/logo-mark.png" alt="ÉBIR BREW STUDIO" class="h-9 w-auto" />
      <span class="flex items-center gap-1.5">
        <span class="font-semibold tracking-wide text-sm">My ÉBIR</span>
        <span class="text-[10px] font-bold leading-none tracking-widest text-ink bg-gold rounded px-1.5 py-1">APP</span>
        <span class="text-[10px] font-semibold leading-none text-ink/50 ring-1 ring-ink/20 rounded px-1 py-0.5">β</span>
      </span>
    </a>
    <a href="./" class="text-xs text-ink/60 hover:text-gold transition">← アプリ</a>
  </div>
</header>

<main class="mx-auto max-w-2xl px-5 min-h-[calc(100dvh-4rem-1px)] flex flex-col items-center justify-center text-center">
  <p class="text-[11px] font-semibold uppercase tracking-[0.25em] text-gold">My ÉBIR — Tasting App</p>
  <h1 class="mt-3 text-2xl font-bold leading-snug">飲んだ一杯を、<br />記録しよう。</h1>
  <span class="mt-3 h-px w-10 bg-gold/70"></span>
  <p class="mt-3 text-sm text-ink/60 leading-relaxed">
    バッジを集めてÉBIR の一杯をもっと楽しく。<br />
    アプリのインストールは不要です。
  </p>

  <!-- 白タイル（cream 地に映えるサイトと同じ見せ方）-->
  <div class="mt-7 rounded-2xl bg-paper p-4 shadow-sm">
    <div id="qr"></div>
  </div>

  <p class="mt-4 text-sm font-medium flex items-center gap-1.5">
    <span class="text-gold">▲</span> スマホのカメラで読み取り
  </p>
  <a href="https://optimisuke.github.io/ebir-brew-studio/app/"
     class="mt-1.5 text-xs text-ink/50 hover:text-gold transition break-all">optimisuke.github.io/ebir-brew-studio/app/</a>

  <p class="mt-6 text-[11px] text-ink/40">
    20歳未満の方の飲酒は法律で禁止されています。
  </p>
</main>

<script>
  const APP_URL = 'https://optimisuke.github.io/ebir-brew-studio/app/';
  new QRCode(document.getElementById('qr'), {
    text: APP_URL,
    width: 190,
    height: 190,
    colorDark: '#141414',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M,
  });
</script>

</body>
</html>
