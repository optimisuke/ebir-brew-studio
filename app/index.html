<main id="app" class="mx-auto max-w-2xl px-5 pt-6 pb-20"><!-- JS で描画 --></main>

<script>
/* =====================================================================
   ÉBIR BREW STUDIO — 来店者向けアプリ（タップリスト + 飲んだ記録 / 1ページ）
   HTML + 素のJS のみ。サーバーなし。記録は localStorage に保存。
   ===================================================================== */

/* === ビール一覧（固定リスト / 単一の情報源）=========================
   1件足すだけでタップリストに追加されます。
   - abv: 数値（%）。不明は null   - ibu: 数値。不明は null
   - img があれば写真、なければ color のビール色スウォッチで表示
   - active:false にすると一覧から外れます（記録とバッジ「伝説の一杯」には残る）
   - new:true は隠しバッジ「新作ハンター」の対象
   - desc: 説明文（店主が随時追記。空でも可）                          */
const BEERS = [
  { id: 'aura',    name: 'AURA DE NADA',    style: 'Sour',    abv: 5.0, ibu: 7,    img: '../assets/aura-de-nada.jpg',    desc: '' },
  { id: 'braggot', name: 'BRAGGOT WHISPER', style: 'Braggot', abv: 5.5, ibu: 33,   img: '../assets/braggot-whisper.jpg', desc: '' },
  { id: 'pine',    name: 'PINE ME DRIFT',   style: 'IPA',     abv: 8.0, ibu: 70,   color: '#B5651D', desc: '' },
  { id: 'lemon',   name: 'Peel My Lemon',   style: 'IPA',     abv: 5.0, ibu: null, color: '#E6B422', desc: '', new: true },
  { id: 'forty',   name: 'FORTY OF HOPE',   style: '',        abv: null, ibu: null, color: '#C9852B', desc: '' },
  { id: 'brut',    name: 'IT BRUT',         style: 'Brut',    abv: null, ibu: null, color: '#EBD27A', desc: '' },
];
const beerById = (id) => BEERS.find((b) => b.id === id);
const isActive = (b) => b.active !== false;

const app = document.getElementById('app');

/* === ストレージ + マイグレーション =================================
   スキーマ版数を localStorage に持ち、起動時に逐次マイグレーションを適用。
   将来データ形を変えるときは MIGRATIONS に1ステップ足して CURRENT を上げる。 */
const RECORDS_KEY  = 'ebir.records';
const SCHEMA_KEY   = 'ebir.schema';
const CELEB_KEY    = 'ebir.celebrated';
const LEGACY_V1    = 'ebir.mybeers.v1';
const CURRENT_SCHEMA = 2;

const uid = () => Date.now().toString(36) + Math.random().toString(16).slice(2, 8);
const readJSON = (k, fallback) => { try { return JSON.parse(localStorage.getItem(k)) ?? fallback; } catch { return fallback; } };

// MIGRATIONS[v] は スキーマ v → v+1 への変換。
const MIGRATIONS = [
  // 0 → 1: 旧フォーマット（ebir.mybeers.v1）から records へ取り込む
  function to1() {
    const legacy = readJSON(LEGACY_V1, []);
    localStorage.setItem(RECORDS_KEY, JSON.stringify(legacy.map((it) => ({
      id: it.id || uid(), beerId: it.beerId, rating: Number(it.rating) || 0,
      note: it.note || '', date: it.date || new Date().toISOString(),
    }))));
  },
  // 1 → 2: スキーマを正規化（欠損フィールドの補完・型の固定）
  function to2() {
    localStorage.setItem(RECORDS_KEY, JSON.stringify(readJSON(RECORDS_KEY, []).map((r) => ({
      id: r.id || uid(), beerId: r.beerId, rating: Number(r.rating) || 0,
      note: r.note || '', date: r.date || new Date().toISOString(),
    }))));
  },
];
function runMigrations() {
  let v = Number(localStorage.getItem(SCHEMA_KEY) || 0);
  while (v < CURRENT_SCHEMA) {
    try { MIGRATIONS[v](); } catch (e) { console.error('migration', v, e); }
    v += 1;
    localStorage.setItem(SCHEMA_KEY, String(v));
  }
}
const loadRecords = () => readJSON(RECORDS_KEY, []);
const saveRecords = (items) => localStorage.setItem(RECORDS_KEY, JSON.stringify(items));

/* === 集計 ========================================================== */
function context(records) {
  const visited = new Set(records.map((r) => r.beerId));
  const activeBeers = BEERS.filter(isActive);
  const visitedActive = activeBeers.filter((b) => visited.has(b.id));
  const perBeer = {};
  records.forEach((r) => { perBeer[r.beerId] = (perBeer[r.beerId] || 0) + 1; });
  // 来店日数 = ユニークな日付の数（同日に何杯飲んでも1回）
  const visitDays = new Set(records.map((r) => new Date(r.date).toLocaleDateString('ja-JP')));
  const stylesByDay = {};
  records.forEach((r) => {
    const day = new Date(r.date).toLocaleDateString('ja-JP');
    const st = (beerById(r.beerId) || {}).style;
    if (!st) return;
    (stylesByDay[day] = stylesByDay[day] || new Set()).add(st);
  });
  return {
    records, visited, activeBeers, visitedActive, perBeer, stylesByDay,
    visitDays, visitDayCount: visitDays.size,
    cups: records.length,
    compDone: activeBeers.length > 0 && visitedActive.length === activeBeers.length,
    compRate: activeBeers.length ? Math.round((visitedActive.length / activeBeers.length) * 100) : 0,
  };
}
const compRateOf = (records) => context(records).compRate;

/* === バッジ定義 ====================================================
   earned(ctx) を満たすと獲得。hidden:true は未獲得のあいだ「???」表示。 */
const BADGES = [
  { id: 'first',     icon: '🍺', name: 'はじめの一杯',  hint: '最初の記録をつける',      earned: (c) => c.cups >= 1 },
  { id: 'regular5',  icon: '🪑', name: '常連（5杯）',   hint: '5杯記録する',            earned: (c) => c.cups >= 5 },
  { id: 'regular10', icon: '🍻', name: '常連（10杯）',  hint: '10杯記録する',           earned: (c) => c.cups >= 10 },
  { id: 'regular25', icon: '👑', name: '常連（25杯）',  hint: '25杯記録する',           earned: (c) => c.cups >= 25 },
  { id: 'complete',  icon: '🏆', name: 'コンプリート',  hint: '現行タップを全制覇',      earned: (c) => c.compDone },

  // --- 隠しバッジ（獲得後に開示）---
  { id: 'nightowl',  icon: '🌙', name: '夜更かし',   hint: '深い時間の一杯',  hidden: true, earned: (c) => c.records.some((r) => { const h = new Date(r.date).getHours(); return h >= 22 || h < 5; }) },
  { id: 'encore',    icon: '🔁', name: 'おかわり',   hint: '同じ銘柄を3回',   hidden: true, earned: (c) => Object.values(c.perBeer).some((n) => n >= 3) },
  { id: 'sommelier', icon: '👃', name: 'きき酒師',   hint: '1日で5スタイル',  hidden: true, earned: (c) => Object.values(c.stylesByDay).some((s) => s.size >= 5) },
  { id: 'newhunter', icon: '🆕', name: '新作ハンター', hint: '新作をいち早く', hidden: true, earned: (c) => c.records.some((r) => (beerById(r.beerId) || {}).new) },
  { id: 'legend',    icon: '🗝️', name: '伝説の一杯', hint: '終売した銘柄を記録', hidden: true, earned: (c) => c.records.some((r) => { const b = beerById(r.beerId); return b && !isActive(b); }) },
  { id: 'knight',    icon: '🛡️', name: 'アーメットの騎士', hint: '真のÉBIR好きへ', hidden: true, earned: (c) => c.compDone && c.cups >= 25 },
];
const evaluateBadges = (ctx) => BADGES.map((b) => ({ ...b, got: !!b.earned(ctx) }));
const earnedIds = (records) => { const c = context(records); return new Set(BADGES.filter((b) => b.earned(c)).map((b) => b.id)); };

/* === 称号定義 ======================================================
   バッジ（複数・収集・永続）とは別物。称号は「1個・成長・上書き」。
   来店日数（ユニークな日付の数）に応じて1つだけ決まり、通うほど昇格する。
   days はその称号に到達するのに必要な来店日数の下限（しきい値）。
   店に合わせて調整するときは days を書き換えるだけ。            */
const TITLES = [
  { lv: 1, name: '新麦', read: 'しんむぎ',   days: 0 },
  { lv: 2, name: '麦汁', read: 'ばくじゅう', days: 1 },
  { lv: 3, name: '発酵', read: 'はっこう',   days: 2 },
  { lv: 4, name: '熟成', read: 'じゅくせい', days: 3 },
  { lv: 5, name: '麦酒', read: 'ばくしゅ',   days: 4 },
];
// 来店日数から現在の称号と次の段階を求める純粋関数。
function titleInfo(days) {
  let idx = 0;
  TITLES.forEach((t, i) => { if (days >= t.days) idx = i; });
  return { current: TITLES[idx], next: TITLES[idx + 1] || null, days };
}

/* === 表示ヘルパー ================================================== */
const escape = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const swatch = (color) =>
  `background:linear-gradient(180deg,#FBF7EF 0%,#FBF7EF 16%,${color || '#C9852B'} 42%,${color || '#C9852B'} 100%)`;
const visual = (b, extra) =>
  b.img
    ? `<img src="${b.img}" alt="${escape(b.name)}" class="w-full h-full object-cover ${extra || ''}" />`
    : `<div class="w-full h-full ${extra || ''}" style="${swatch(b.color)}"></div>`;
const specLine = (b) => {
  const parts = [];
  if (b.style) parts.push(escape(b.style));
  if (b.abv != null) parts.push(b.abv.toFixed(1) + '%');
  if (b.ibu != null) parts.push('IBU ' + b.ibu);
  return parts.join(' ・ ');
};
const fmtDate = (iso) => {
  const d = new Date(iso);
  return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
};
const fmtTime = (iso) => {
  const d = new Date(iso);
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
};
const starText = (n) => '★★★★★'.slice(0, n) + '☆☆☆☆☆'.slice(0, 5 - n);

// きろくの1件カード（タップで編集）
function recordCard(r) {
  const b = beerById(r.beerId) || { name: '（不明な銘柄）', color: '#C9852B' };
  const thumb = b.img
    ? `<img src="${b.img}" alt="" class="w-full h-full object-cover" />`
    : `<div class="w-full h-full" style="${swatch(b.color)}"></div>`;
  return `
    <div data-edit="${r.id}" role="button" tabindex="0" class="rounded-2xl border border-ink/10 p-4 flex gap-4 cursor-pointer hover:border-gold/40 transition">
      <div class="shrink-0 w-14 h-14 rounded-xl overflow-hidden ring-1 ring-ink/10">${thumb}</div>
      <div class="min-w-0 flex-1">
        <h3 class="font-semibold break-words leading-tight">${escape(b.name)}</h3>
        <p class="mt-0.5 text-xs text-ink/40 tabular-nums">${fmtDate(r.date)} ${fmtTime(r.date)}</p>
        ${r.rating ? `<p class="mt-1.5 text-gold tracking-widest text-sm">${starText(r.rating)}</p>` : ''}
        ${r.note ? `<p class="mt-1.5 text-sm text-ink/70 whitespace-pre-wrap break-words">${escape(r.note)}</p>` : ''}
      </div>
    </div>`;
}

// コンプ率に応じた色（黒→ブロンズ→金へ少しずつ昇格）
const compColor = (r) =>
  r >= 100 ? '#E2A52A' : r >= 75 ? '#D29A22' : r >= 50 ? '#B5781F' : r >= 25 ? '#7C5A2E' : '#141414';

// 称号のティアカラー（Lvが上がるほどストーン→ブロンズ→アンバー→金へ昇格）
const TITLE_TIERS = {
  // base=塗り, light=リム明色, dark=リム暗色, mark=ロゴと数字（同系の濃トーン）
  // 王道メタル: Lvが上がるほど 石→銅→銀→金→ダイヤ に昇格
  1: { base: '#8C8A85', light: '#AFADAA', dark: '#656360', mark: '#434240' }, // 新麦: アイアン
  2: { base: '#C77B3B', light: '#D8A376', dark: '#8F592A', mark: '#603B1C' }, // 麦汁: ブロンズ
  3: { base: '#B4BAC2', light: '#CBCFD4', dark: '#82868C', mark: '#56595D' }, // 発酵: シルバー
  4: { base: '#E2A52A', light: '#EBC06A', dark: '#A3771E', mark: '#6C4F14' }, // 熟成: ゴールド
  5: { base: '#7CC4D6', light: '#A3D6E2', dark: '#598D9A', mark: '#3C5E67' }, // 麦酒: ダイヤ
};
const tierOf = (lv) => TITLE_TIERS[lv] || TITLE_TIERS[1];

// 称号カード（メダル風アイコン + 全体進捗ステッパー / コンパクト）
function titleCard(ctx) {
  const { current, next, days } = titleInfo(ctx.visitDayCount);
  const tier = tierOf(current.lv);
  // Lv1→最高位の「ぜんたいでどこまで来たか」を段階バーで表示（到達した段は各Lvのティア色で塗る）
  const steps = TITLES.map((t) =>
    `<span class="h-1.5 flex-1 rounded-full" style="background:${days >= t.days ? tierOf(t.lv).base : 'rgba(20,20,20,.1)'}"></span>`).join('');
  const caption = next
    ? `次の<span class="font-semibold text-ink/55">${escape(next.name)}</span>まであと${Math.max(0, next.days - days)}日`
    : `<span class="text-gold font-semibold">最高位に到達 🍺</span>`;
  return `
    <div class="rounded-2xl border border-ink/10 p-3 flex flex-col">
      <div class="flex items-center gap-2.5">
        <div class="hexmedal shrink-0 w-14 h-12" style="background:linear-gradient(140deg, ${tier.light} 0%, ${tier.dark} 52%, ${tier.mark} 100%)">
          <span class="hex-inner" style="background:${tier.base}"></span>
          <span class="hex-content absolute inset-0 flex flex-col items-center justify-center leading-none">
            <span class="hex-mark w-7 h-7" style="background:${tier.mark}"></span>
            <span class="text-[9px] font-extrabold tabular-nums mt-px" style="color:${tier.mark}">Lv.${current.lv}</span>
          </span>
        </div>
        <div class="min-w-0">
          <p class="text-[10px] text-ink/40 tracking-widest font-semibold leading-none">称号</p>
          <p class="text-lg font-bold leading-tight truncate">${escape(current.name)}</p>
          <p class="text-[10px] text-ink/40 leading-none truncate">${escape(current.read)}</p>
        </div>
      </div>
      <div class="mt-auto pt-2.5">
        <div class="flex items-center gap-1">${steps}</div>
        <p class="mt-1.5 text-[10px] text-ink/45 leading-tight">${caption}</p>
      </div>
    </div>`;
}

/* === メインページ描画 ============================================= */
let tapFilter = 'all';            // 'all' | 'unvisited'
const expandedDays = new Set();   // 展開中の過去日（キーは fmtDate の文字列）

function render() {
  const records = loadRecords();
  const ctx = context(records);
  const badges = evaluateBadges(ctx);
  const gotCount = badges.filter((x) => x.got).length;
  const active = ctx.activeBeers;
  const shown = tapFilter === 'unvisited' ? active.filter((b) => !ctx.visited.has(b.id)) : active;

  // --- コンプ率（コンパクト / 進むほど色が金へ昇格）---
  const cc = compColor(ctx.compRate);
  const banner = `
    <div class="rounded-2xl border border-ink/10 p-3 flex flex-col">
      <div class="flex items-baseline justify-between">
        <span class="text-2xl font-extrabold leading-none tabular-nums" style="color:${cc}">${ctx.compRate}<span class="text-xs font-bold">%</span></span>
        <span class="text-[10px] text-ink/40 tabular-nums">${ctx.visitedActive.length}/${active.length}種</span>
      </div>
      <p class="mt-1 text-[10px] text-ink/40 tracking-widest font-semibold uppercase">コンプ率</p>
      <div class="mt-auto pt-2.5">
        <div class="h-1.5 rounded-full bg-ink/10 overflow-hidden">
          <div class="h-full rounded-full transition-all" style="width:${ctx.compRate}%;background:${cc}"></div>
        </div>
        <p class="mt-1.5 text-[10px] text-ink/45 leading-tight">${ctx.cups}杯記録${ctx.compDone ? ' ・ <span class="text-gold font-semibold">制覇🏆</span>' : ''}</p>
      </div>
    </div>`;

  // --- タップリスト ---
  const cards = shown.map((b) => {
    const done = ctx.visited.has(b.id);
    const n = ctx.perBeer[b.id] || 0;
    return `
      <button type="button" data-beer="${b.id}" class="beer-card snap-start shrink-0 w-32 text-left group">
        <div class="relative aspect-[3/4] rounded-2xl overflow-hidden ring-1 ring-ink/10 transition group-hover:ring-gold group-active:ring-gold">
          ${visual(b)}
          ${done ? `<span class="absolute top-2 right-2 grid place-items-center min-w-7 h-7 px-1.5 rounded-full bg-gold text-ink text-sm font-bold shadow tabular-nums">${n > 1 ? n : '✓'}</span>` : ''}
        </div>
        <p class="mt-2 text-sm font-medium leading-tight break-words min-h-[2.5em]">${escape(b.name)}</p>
        ${specLine(b) ? `<p class="text-xs text-gold leading-tight mt-0.5">${specLine(b)}</p>` : ''}
      </button>`;
  }).join('');
  const grid = shown.length
    ? `<div id="taps" class="mt-5 flex items-start gap-3 overflow-x-auto snap-x snap-mandatory pb-2 scrollbar-hide">${cards}</div>`
    : `<div class="mt-5 rounded-2xl border border-dashed border-ink/15 py-14 text-center text-sm text-ink/40">
         未飲の銘柄はありません。<br />ラインナップは制覇済みです 🎉</div>`;

  // --- きろく（今日は展開、昨日より前は日でまとめてタップで展開）---
  const todayKey = fmtDate(new Date().toISOString());
  const groups = [];
  const gIdx = {};
  records.forEach((r) => {
    const k = fmtDate(r.date);
    if (!(k in gIdx)) { gIdx[k] = groups.length; groups.push({ key: k, items: [] }); }
    groups[gIdx[k]].items.push(r);
  });
  const recList = records.length
    ? groups.map((g) => {
        if (g.key === todayKey) {
          return `<div class="mt-5 space-y-4">${g.items.map(recordCard).join('')}</div>`;
        }
        const open = expandedDays.has(g.key);
        return `
        <div class="mt-3">
          <button data-day="${g.key}" class="w-full flex items-center justify-between rounded-2xl border border-ink/10 px-4 py-3.5 text-left hover:border-gold/40 transition">
            <span class="text-sm font-medium">${g.key}</span>
            <span class="text-xs text-ink/40">${g.items.length}杯　${open ? '▲' : '▼'}</span>
          </button>
          ${open ? `<div class="mt-3 space-y-4">${g.items.map(recordCard).join('')}</div>` : ''}
        </div>`;
      }).join('')
    : `<div class="mt-5 rounded-2xl border border-dashed border-ink/15 py-12 text-center text-sm text-ink/40">
         まだ記録がありません。<br />上のラインナップから最初の一杯を記録しましょう。</div>`;

  // --- バッジ ---
  const badgeGrid = `
    <div class="mt-4 grid grid-cols-3 sm:grid-cols-4 gap-3">
      ${badges.map((b) => {
        const locked = b.hidden && !b.got;
        return `
        <div class="rounded-2xl border p-3 text-center ${b.got ? 'border-gold ring-1 ring-gold/40 bg-gold/5' : 'border-ink/10 opacity-60'}">
          <div class="text-3xl ${b.got ? '' : 'grayscale'}">${locked ? '🔒' : b.icon}</div>
          <div class="mt-1.5 text-[11px] font-medium leading-tight">${locked ? '???' : escape(b.name)}</div>
          <div class="mt-0.5 text-[10px] leading-tight ${b.got ? 'text-gold' : 'text-ink/35'}">${b.got ? '獲得' : (locked ? '？？？' : escape(b.hint))}</div>
        </div>`;
      }).join('')}
    </div>`;

  show(`
    <section class="pt-2 text-center">
      <h1 class="text-2xl font-bold">マイエビール記録</h1>
      <p class="mt-1.5 text-sm text-ink/50">飲んだらタップして記録。<br class="sm:hidden" />記録はこの端末の中だけに保存されます。</p>
    </section>

    <div class="mt-6 grid grid-cols-2 gap-3">${titleCard(ctx)}${banner}</div>

    <section class="mt-8">
      <div class="flex items-center gap-2">
        <h2 class="text-sm font-semibold">ラインナップ</h2>
        <span class="ml-auto inline-flex gap-2">
          <button data-filter="all"       class="rounded-full px-3.5 py-1 text-xs font-medium transition ${tapFilter === 'all' ? 'bg-ink text-paper' : 'ring-1 ring-ink/15 text-ink/60'}">すべて</button>
          <button data-filter="unvisited" class="rounded-full px-3.5 py-1 text-xs font-medium transition ${tapFilter === 'unvisited' ? 'bg-ink text-paper' : 'ring-1 ring-ink/15 text-ink/60'}">未飲</button>
        </span>
      </div>
      ${grid}
    </section>

    <section class="mt-10">
      <div class="flex items-baseline justify-between">
        <h2 class="text-sm font-semibold text-ink/40 uppercase tracking-widest">きろく</h2>
        <span class="text-xs text-ink/40">${records.length ? records.length + '件' : ''}</span>
      </div>
      ${recList}
    </section>

    <section class="mt-10">
      <div class="flex items-baseline justify-between">
        <h2 class="text-sm font-semibold text-ink/40 uppercase tracking-widest">バッジ</h2>
        <span class="text-xs text-ink/40">${gotCount}/${badges.length}</span>
      </div>
      ${badgeGrid}
    </section>

    <p class="mt-10 text-center text-[11px] text-ink/30">
      <a href="qr.html" class="hover:text-gold transition">このアプリをQRコードでシェア</a>
    </p>
  `);

  app.querySelectorAll('[data-filter]').forEach((btn) =>
    btn.addEventListener('click', () => { tapFilter = btn.dataset.filter; render(); }));
}
function show(html) { app.innerHTML = html; }

/* === 記録シート（ビールをタップで開く）============================= */
let formRating = 0;

const openCheckin = (beerId) => openSheet(beerId, null);
function openEdit(recId) {
  const r = loadRecords().find((x) => x.id === recId);
  if (r) openSheet(r.beerId, recId);
}

// 記録シート。editId があれば既存記録の編集（すき度・メモ・削除）、なければ新規記録。
function openSheet(beerId, editId) {
  const b = beerById(beerId);
  if (!b) return;
  const editing = !!editId;
  const rec = editing ? loadRecords().find((r) => r.id === editId) : null;
  if (editing && !rec) return;
  formRating = editing ? (rec.rating || 0) : 0;
  const mine = loadRecords().filter((r) => r.beerId === beerId);

  const overlay = document.createElement('div');
  overlay.className = 'sheet-overlay';
  overlay.innerHTML = `
    <div class="sheet px-5 pt-3 pb-8" role="dialog" aria-label="${escape(b.name)} を${editing ? '編集' : '記録'}">
      <div class="mx-auto mb-4 h-1.5 w-10 rounded-full bg-ink/15"></div>

      <div class="flex gap-4">
        <div class="shrink-0 w-20 aspect-[3/4] rounded-xl overflow-hidden ring-1 ring-ink/10">${visual(b)}</div>
        <div class="min-w-0 flex-1">
          <h2 class="text-lg font-bold break-words leading-tight">${escape(b.name)}</h2>
          ${specLine(b) ? `<p class="mt-1 text-sm text-gold font-medium">${specLine(b)}</p>` : ''}
          ${editing
            ? `<p class="mt-1 text-xs text-ink/50">${fmtDate(rec.date)} ${fmtTime(rec.date)} の記録を編集</p>`
            : (mine.length ? `<p class="mt-1 text-xs text-ink/50">これまで ${mine.length}杯</p>` : '')}
        </div>
      </div>

      ${b.desc ? `<p class="mt-3 text-sm text-ink/70 leading-relaxed whitespace-pre-wrap">${escape(b.desc)}</p>` : ''}

      <div class="mt-5">
        <span class="block text-sm font-medium">お気に入り指数 <span class="text-ink/40 font-normal">（任意）</span></span>
        <div id="stars" class="mt-1.5 flex gap-1.5 text-4xl text-ink/20 select-none" role="radiogroup" aria-label="お気に入り指数">
          ${[1, 2, 3, 4, 5].map((n) => `<button type="button" data-val="${n}" class="star transition active:scale-95" aria-label="星${n}">★</button>`).join('')}
        </div>
      </div>

      <div class="mt-4">
        <label for="note" class="block text-sm font-medium">メモ <span class="text-ink/40 font-normal">（任意）</span></label>
        <textarea id="note" rows="2" placeholder="香り、味わい、その日のことなど"
                  class="mt-1.5 w-full rounded-xl border border-ink/15 px-4 py-3 text-base resize-y focus:border-ink focus:outline-none focus:ring-2 focus:ring-ink/10"></textarea>
      </div>

      <div class="mt-5 flex gap-3">
        <button id="cancel" type="button" class="rounded-xl px-5 py-3.5 text-sm font-semibold ring-1 ring-ink/15 text-ink/60 hover:text-ink transition">閉じる</button>
        <button id="save" type="button" class="flex-1 rounded-xl bg-gold text-ink py-3.5 text-sm font-semibold hover:bg-goldDark hover:text-paper transition">${editing ? '保存する' : '✓ 飲んだ！記録する'}</button>
      </div>

      ${editing ? `<button id="delete" type="button" class="mt-3 w-full text-center text-xs text-ink/40 hover:text-gold transition">この記録を削除</button>` : ''}

      ${(!editing && mine.length) ? `
      <div class="mt-6">
        <h3 class="text-xs font-semibold text-ink/40 uppercase tracking-widest">この銘柄のきろく</h3>
        <ul class="mt-3 space-y-2">${mine.map((r) => `
          <li class="rounded-xl border border-ink/10 px-3 py-2 text-sm">
            <span class="text-xs text-ink/40">${fmtDate(r.date)} ${fmtTime(r.date)}</span>
            ${r.rating ? `<span class="ml-2 text-gold tracking-widest">${starText(r.rating)}</span>` : ''}
            ${r.note ? `<p class="mt-0.5 text-ink/70 whitespace-pre-wrap break-words">${escape(r.note)}</p>` : ''}
          </li>`).join('')}</ul>
      </div>` : ''}
    </div>`;

  const close = () => overlay.remove();
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  overlay.querySelector('#cancel').addEventListener('click', close);

  const starsEl = overlay.querySelector('#stars');
  const paint = (val) => starsEl.querySelectorAll('.star').forEach((s) => {
    const on = Number(s.dataset.val) <= val;
    s.classList.toggle('text-gold', on); s.classList.toggle('text-ink/20', !on);
  });
  starsEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.star'); if (!btn) return;
    const val = Number(btn.dataset.val);
    formRating = formRating === val ? 0 : val;
    paint(formRating);
  });

  const noteEl = overlay.querySelector('#note');
  if (editing) { noteEl.value = rec.note || ''; paint(formRating); }

  overlay.querySelector('#save').addEventListener('click', () => {
    if (editing) updateRecord(editId, formRating, noteEl.value.trim());
    else addRecord(beerId, formRating, noteEl.value.trim());
    close();
    render();
  });

  if (editing) overlay.querySelector('#delete').addEventListener('click', () => {
    if (!confirm('この記録を削除しますか？')) return;
    deleteRecord(editId);
    close();
    render();
  });

  document.body.appendChild(overlay);
}

/* === 記録の追加・削除 ============================================== */
function addRecord(beerId, rating, note) {
  const records = loadRecords();
  const before = compRateOf(records);
  const beforeBadges = earnedIds(records);
  const beforeTitle = titleInfo(context(records).visitDayCount).current.lv;
  records.unshift({ id: uid(), beerId, rating: Number(rating) || 0, note: note || '', date: new Date().toISOString() });
  saveRecords(records);
  const after = compRateOf(records);
  // 称号が昇格したらトースト（初回チェックインの Lv1→Lv2 もここで通知）
  const afterTitle = titleInfo(context(records).visitDayCount);
  if (afterTitle.current.lv > beforeTitle) showTitleToast(afterTitle.current);
  // 新しく獲得したバッジのトースト（complete はコンプ演出があるので除く）
  const afterBadges = earnedIds(records);
  BADGES.forEach((b) => {
    if (b.id !== 'complete' && afterBadges.has(b.id) && !beforeBadges.has(b.id)) showBadgeToast(b);
  });
  if (after >= 100 && before < 100 && !localStorage.getItem(CELEB_KEY)) {
    localStorage.setItem(CELEB_KEY, '1');
    celebrate();
  }
  if (after < 100) localStorage.removeItem(CELEB_KEY);
}

function updateRecord(id, rating, note) {
  const records = loadRecords();
  const r = records.find((x) => x.id === id);
  if (!r) return;
  r.rating = Number(rating) || 0;
  r.note = note || '';
  saveRecords(records);
}

function deleteRecord(id) {
  saveRecords(loadRecords().filter((r) => r.id !== id));
  if (compRateOf(loadRecords()) < 100) localStorage.removeItem(CELEB_KEY);
}

// クリック委譲: ビールタップ → 記録シート / 過去日の開閉 / 記録タップ → 編集
app.addEventListener('click', (e) => {
  const beer = e.target.closest('[data-beer]');
  if (beer) { openCheckin(beer.dataset.beer); return; }
  const day = e.target.closest('[data-day]');
  if (day) { const k = day.dataset.day; expandedDays.has(k) ? expandedDays.delete(k) : expandedDays.add(k); render(); return; }
  const edit = e.target.closest('[data-edit]');
  if (edit) { openEdit(edit.dataset.edit); return; }
});

/* === バッジ獲得トースト ============================================ */
function showBadgeToast(badge) {
  let wrap = document.querySelector('.toast-wrap');
  if (!wrap) { wrap = document.createElement('div'); wrap.className = 'toast-wrap'; document.body.appendChild(wrap); }
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `
    <span class="ic">${badge.icon}</span>
    <div class="text-left">
      <p class="text-[10px] font-bold tracking-widest text-gold uppercase leading-none">バッジ獲得</p>
      <p class="text-sm font-semibold leading-tight mt-1">${escape(badge.name)}</p>
    </div>`;
  wrap.appendChild(t);
  setTimeout(() => { t.remove(); if (wrap && !wrap.children.length) wrap.remove(); }, 2800);
}

// 称号アップのトースト（バッジとは別物。1個・成長・上書き）
function showTitleToast(title) {
  let wrap = document.querySelector('.toast-wrap');
  if (!wrap) { wrap = document.createElement('div'); wrap.className = 'toast-wrap'; document.body.appendChild(wrap); }
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `
    <span class="ic">🎖️</span>
    <div class="text-left">
      <p class="text-[10px] font-bold tracking-widest text-gold uppercase leading-none">称号アップ Lv.${title.lv}</p>
      <p class="text-sm font-semibold leading-tight mt-1">${escape(title.name)} <span class="text-xs text-ink/40 font-normal">${escape(title.read)}</span></p>
    </div>`;
  wrap.appendChild(t);
  setTimeout(() => { t.remove(); if (wrap && !wrap.children.length) wrap.remove(); }, 2800);
}

/* === コンプ達成の金色演出 ========================================== */
function celebrate() {
  const el = document.createElement('div');
  el.className = 'celebrate';
  const sparks = Array.from({ length: 12 }, (_, i) =>
    `<span class="spark" style="left:${8 + i * 7}%; top:${50 + (i % 3) * 8}%; animation-delay:${(i % 6) * 0.18}s"></span>`).join('');
  el.innerHTML = `
    ${sparks}
    <div class="celebrate-card">
      <div class="trophy">🏆</div>
      <p class="mt-4 text-2xl font-bold tracking-wide">コンプリート！</p>
      <p class="mt-1 text-sm text-paper/80">ラインナップ、全制覇おめでとうございます。</p>
      <p class="mt-6 text-xs text-paper/60">タップして閉じる</p>
    </div>`;
  el.addEventListener('click', () => el.remove());
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 6000);
}

/* === 起動 ========================================================== */
runMigrations();
render();
</script>
